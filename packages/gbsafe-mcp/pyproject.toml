[project]
name = "gbsafe-mcp"
version = "0.1.0"
description = "GB SafeData MCP 서버 — AI가 출처를 인용하며 재난 공공데이터를 조회하는 읽기 전용 도구"
requires-python = ">=3.12"
dependencies = [
    "gbsafe-core",
    "gbsafe-connectors",
    "mcp>=1.2",
]

[project.scripts]
gbsafe-mcp = "gbsafe_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gbsafe_mcp"]

[tool.uv.sources]
gbsafe-core = { workspace = true }
gbsafe-connectors = { workspace = true }
