[project]
name = "gbsafe-core"
version = "0.1.0"
description = "GB SafeData 공통 스키마·라이선스 게이트·신선도·카탈로그·스냅샷"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gbsafe_core"]
