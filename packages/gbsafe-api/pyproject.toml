[project]
name = "gbsafe-api"
version = "0.1.0"
description = "GB SafeData 표준 API — 기존 행정시스템이 연계할 수 있는 인용 포함 REST"
requires-python = ">=3.12"
dependencies = [
    "gbsafe-core",
    "gbsafe-connectors",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gbsafe_api"]

[tool.uv.sources]
gbsafe-core = { workspace = true }
gbsafe-connectors = { workspace = true }
