[project]
name = "gbsafe-connectors"
version = "0.1.0"
description = "경북 재난 공공데이터 원천 커넥터 — 수집·정규화·장애 표면화"
requires-python = ">=3.12"
dependencies = [
    "gbsafe-core",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gbsafe_connectors"]

[tool.uv.sources]
gbsafe-core = { workspace = true }
