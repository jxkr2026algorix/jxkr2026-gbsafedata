[project]
name = "gbsafe-cli"
version = "0.1.0"
description = "GB SafeData CLI — 검색·검증·인용·진단 도구"
requires-python = ">=3.12"
dependencies = [
    "gbsafe-core",
    "gbsafe-connectors",
    "gbsafe-api",
    "gbsafe-mcp",
    "typer>=0.15",
    "rich>=13.9",
]

[project.scripts]
gbsafe = "gbsafe_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gbsafe_cli"]

[tool.uv.sources]
gbsafe-core = { workspace = true }
gbsafe-connectors = { workspace = true }
gbsafe-api = { workspace = true }
gbsafe-mcp = { workspace = true }
